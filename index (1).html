<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAC-PRÉVENTION</title>
<style>
:root{--vh:100vh;--res:130px}@supports (height:100dvh){:root{--vh:100dvh}}
@media (pointer:coarse){:root{--res:215px}}
html,body{margin:0;height:100%}
body{background:#1e1e2e;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#pp-wrap{--gw:min(calc(100vw - 14px),calc((var(--vh) - var(--res))*1.4),760px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;box-sizing:border-box}
#game{position:relative;width:var(--gw);aspect-ratio:462/330;container-type:inline-size;background:#11111b;box-shadow:0 0 0 3px #6c7086;border-radius:8px;overflow:hidden;line-height:0;outline:none}
#pp-cv{width:100%;height:100%;display:block}
#pp-ov{position:absolute;inset:0;background:#11111bf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2cqw;line-height:1.3;overflow:auto;font-size:12px;font-size:clamp(9px,3cqw,16px)}
#pp-ov h2{margin:.2em 0;color:#f9e2af;font-size:1.7em}
#pp-ov p{margin:.25em 0;max-width:92%}
.pp-b{cursor:pointer;margin:.3em;padding:.6em 1.2em;border:0;border-radius:8px;background:#89b4fa;color:#11111b;font-weight:700;font-size:1.05em}
.pp-b.r{background:#f38ba8}
#pp-side{width:var(--gw);display:flex;flex-direction:column;gap:8px}
#pp-hud{background:#181825;padding:8px 12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
#pp-msg{color:#f9e2af;flex:1;min-height:38px;display:flex;align-items:center;line-height:1.25}
#pp-st{background:#313244;padding:4px 10px;border-radius:4px;white-space:nowrap;font-weight:700;font-size:13px}
#pp-mu{border:0;background:#313244;color:#fff;border-radius:6px;padding:6px 8px;cursor:pointer}
#pp-pad{display:none;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:280px;margin:0 auto}
#pp-pad button{height:58px;border:0;border-radius:10px;background:#313244;color:#fff;font-size:22px;touch-action:manipulation}
@media (pointer:coarse){#pp-pad{display:grid}}
@media (orientation:landscape) and (max-height:700px){#pp-wrap{--gw:min(calc(100vw - 240px),calc((var(--vh) - 16px)*1.4));flex-direction:row;gap:12px}#pp-side{width:210px}#pp-hud{flex-direction:column;align-items:stretch}#pp-pad{max-width:none}#pp-pad button{height:46px}}
</style>
</head>
<body>
<div id="pp-wrap">
  <div id="game" tabindex="0"><canvas id="pp-cv" width="462" height="330"></canvas><div id="pp-ov"></div></div>
  <div id="pp-side"><div id="pp-hud"><div id="pp-msg">Utilise les flèches pour bouger.</div><div id="pp-st">0 pts</div><button id="pp-mu" aria-label="Son">🔊</button></div>
  <div id="pp-pad"><span></span><button id="pp-u">▲</button><span></span><button id="pp-l">◀</button><button id="pp-d">▼</button><button id="pp-r">▶</button></div></div>
</div>
<script>
(function(){
var T=22,W=21,H=15,CODE="4829",$=function(i){return document.getElementById(i)};
var MAP=["#####################","#.........#.........#","#.###.###.#.###.###.#","#...................#","#.###.#.#####.#.###.#","#.....#.......#.....#","#.###.#.#####.#.###.#","#.....#.......#.....#","#.###.#.#####.#.###.#","#.....#.......#.....#","#.###.#.#####.#.###.#","#...................#","#.###.###.#.###.###.#","#.........#.........#","#####################"];
var GOOD=[[1,1,"💧","Boire de l’eau, faire une pause : ton corps se régule sans produit."],[19,1,"🏃","Le sport procure du bien-être sans aucun produit."],[1,13,"😴","Bien dormir protège ton humeur et ta concentration."],[19,13,"🤝","En parler à un ami de confiance, ça allège."],[10,7,"📞","Drogues Info Service : 0 800 23 13 13, gratuit et anonyme."],[10,11,"🎸","Une passion est un super bouclier."]];
var BAD=[[5,1,"🚬","Tabac : la nicotine rend vite dépendant."],[15,1,"🍺","Alcool : interdit aux mineurs, il augmente les accidents."],[5,13,"💨","Vape avec nicotine : risque de dépendance."],[15,13,"💊","Médicaments détournés : jamais sans avis médical."],[10,5,"🌿","Cannabis : mémoire et attention touchées, usage interdit."]];
var GST=[[1,11,"#f38ba8"],[19,11,"#f5c2e7"],[9,13,"#fab387"]];
var cv=$("pp-cv"),ctx=cv.getContext("2d"),bg=document.createElement("canvas");bg.width=W*T;bg.height=H*T;
var st="menu",hard=false,score=0,lives=3,dots=0,goods=0,bad=0,P,G=[],dotAt,items={},want={x:0,y:0},scared=0,freeze=0,pops=[],mu=false,AC,last=0;

function bp(f,d,ty){if(mu)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=ty||"square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function free(c,r){return r>=0&&r<H&&c>=0&&c<W&&MAP[r][c]!="#"}
function ent(c,r){return{c:c,r:r,nc:c,nr:r,p:1,dx:0,dy:0,a:0}}
function pos(e){var t=e.p>1?1:e.p;return[(e.c+(e.nc-e.c)*t)*T+T/2,(e.r+(e.nr-e.r)*t)*T+T/2]}
function setMsg(t,c){var m=$("pp-msg");m.textContent=t;m.style.color=c=="g"?"#a6e3a1":c=="b"?"#f38ba8":"#f9e2af"}
function hudUp(){$("pp-st").innerHTML=(score<0?'<span style="color:#f38ba8">'+score+'</span>':score)+" pts · "+"❤️".repeat(Math.max(0,lives))+" · reste "+(dots+goods)}
function pop(x,y,t,c){pops.push({x:x,y:y,t:t,c:c,l:1})}

function buildBg(){var b=bg.getContext("2d");b.fillStyle="#11111b";b.fillRect(0,0,bg.width,bg.height);
  b.lineWidth=2;b.lineCap="round";
  for(var r=0;r<H;r++)for(var c=0;c<W;c++){if(MAP[r][c]!="#")continue;
    var x=c*T,y=r*T;b.fillStyle="#1e2352";b.fillRect(x,y,T,T);
    b.strokeStyle="#89b4fa";b.shadowColor="#89b4fa";b.shadowBlur=6;
    var S=[[0,-1,x,y,x+T,y],[0,1,x,y+T,x+T,y+T],[-1,0,x,y,x,y+T],[1,0,x+T,y,x+T,y+T]];
    for(var i=0;i<4;i++){var s=S[i];if(free(c+s[0],r+s[1])){b.beginPath();b.moveTo(s[2],s[3]);b.lineTo(s[4],s[5]);b.stroke()}}
    b.shadowBlur=0}}
function resetPos(){P=ent(10,3);G=GST.slice(0,hard?3:2).map(function(g){var e=ent(g[0],g[1]);e.col=g[2];e.s=g;return e});scared=0}
function init(h){hard=h;score=0;lives=3;bad=0;pops=[];items={};dotAt=[];dots=0;goods=GOOD.length;
  for(var r=0;r<H;r++){dotAt[r]=[];for(var c=0;c<W;c++){var d=MAP[r][c]==".";dotAt[r][c]=d;if(d)dots++}}
  function put(a,g){items[a[0]+","+a[1]]={e:a[2],g:g,m:a[3]};if(dotAt[a[1]][a[0]]){dotAt[a[1]][a[0]]=false;dots--}}
  GOOD.forEach(function(a){put(a,1)});BAD.forEach(function(a){put(a,0)});
  resetPos();want={x:0,y:0};freeze=1.6;st="play";
  setMsg("Mange tout : pastilles et bons réflexes. Évite les produits !","");hudUp();
  $("pp-ov").style.display="none";$("game").focus()}

function arrive(){var c=P.c,r=P.r,k=c+","+r,ch=false;
  if(dotAt[r][c]){dotAt[r][c]=false;dots--;score+=10;ch=true;bp(520,.04)}
  var it=items[k];
  if(it){delete items[k];ch=true;var x=c*T+T/2,y=r*T;
    if(it.g){goods--;score+=100;scared=hard?5:7;pop(x,y,"+100","#a6e3a1");setMsg("✅ "+it.e+" "+it.m+" Bouclier activé !","g");bp(700,.1);bp(990,.15)}
    else{bad++;score-=50;pop(x,y,"−50","#f38ba8");setMsg("⚠️ "+it.e+" "+it.m+" (−50)","b");bp(130,.3,"sawtooth")}}
  if(ch){hudUp();if(dots+goods<=0)end(true)}}
function movePac(dt){var e=P;
  if((e.dx||e.dy)&&(want.x||want.y)&&want.x==-e.dx&&want.y==-e.dy){var c=e.c,r=e.r;e.c=e.nc;e.r=e.nr;e.nc=c;e.nr=r;e.p=1-e.p;e.dx=want.x;e.dy=want.y;e.a=Math.atan2(e.dy,e.dx)}
  e.p+=dt*5.6;
  while(e.p>=1){e.c=e.nc;e.r=e.nr;e.p-=1;arrive();if(st!="play")return;
    if((want.x||want.y)&&free(e.c+want.x,e.r+want.y)){e.dx=want.x;e.dy=want.y}
    else if(!free(e.c+e.dx,e.r+e.dy)){e.dx=0;e.dy=0}
    if(e.dx||e.dy){e.nc=e.c+e.dx;e.nr=e.r+e.dy;e.a=Math.atan2(e.dy,e.dx)}else{e.nc=e.c;e.nr=e.r;e.p=1;break}}}
function moveG(g,dt){g.p+=dt*(scared>0?3:(hard?5:4.2));
  while(g.p>=1){g.c=g.nc;g.r=g.nr;g.p-=1;
    var o=[[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){return free(g.c+d[0],g.r+d[1])});
    var f=o.filter(function(d){return !(d[0]==-g.dx&&d[1]==-g.dy)});if(f.length)o=f;
    var d;if(Math.random()<.7){o.sort(function(a,b){var da=Math.pow(g.c+a[0]-P.c,2)+Math.pow(g.r+a[1]-P.r,2),db=Math.pow(g.c+b[0]-P.c,2)+Math.pow(g.r+b[1]-P.r,2);return da-db});d=scared>0?o[o.length-1]:o[0]}
    else d=o[Math.floor(Math.random()*o.length)];
    g.dx=d[0];g.dy=d[1];g.nc=g.c+d[0];g.nr=g.r+d[1]}}
function hit(){lives--;score-=100;var q=pos(P);pop(q[0],q[1],"−100","#f38ba8");bp(100,.5,"sawtooth");
  setMsg("👻 La pression du groupe t’a rattrapé (−100). Garde ton cap !","b");hudUp();
  if(lives<=0){end(false);return}resetPos();want={x:0,y:0};freeze=1.6}
function update(dt){for(var i=pops.length-1;i>=0;i--){pops[i].l-=dt;pops[i].y-=12*dt;if(pops[i].l<=0)pops.splice(i,1)}
  if(freeze>0){freeze-=dt;return}
  if(scared>0)scared-=dt;
  movePac(dt);if(st!="play")return;
  G.forEach(function(g){moveG(g,dt)});
  var pp=pos(P);
  for(var i=0;i<G.length;i++){var g=G[i],q=pos(g);
    if(Math.hypot(pp[0]-q[0],pp[1]-q[1])<T*.62){
      if(scared>0){score+=200;pop(q[0],q[1],"+200 NON !","#89b4fa");setMsg("💪 Tu as repoussé la pression du groupe ! +200","g");bp(880,.2);hudUp();
        g.c=g.s[0];g.r=g.s[1];g.nc=g.c;g.nr=g.r;g.p=1;g.dx=0;g.dy=0}
      else{hit();return}}}}
function end(win){st="over";var b=0;if(win){b=(BAD.length-bad)*50;score+=b;bp(523,.15);bp(659,.15);bp(784,.3)}
  hudUp();var rk=score<0?"En danger":score<1000?"Apprenti":score<1800?"Éclaireur":"Gardien de la prévention",o=$("pp-ov");o.style.display="flex";
  o.innerHTML='<h2>'+(win?"🏆 Mission réussie !":"💥 Partie terminée")+'</h2><p style="font-size:30px;font-weight:700;color:'+(score<0?"#f38ba8":"#a6e3a1")+'">'+score+' pts</p><p>Rang : <b>'+rk+'</b>'+(win?'<br>Bonus esquive : +'+b+' pts':'')+'</p>'+(win?'<p>🔑 Code de sortie : <b style="font-size:24px;letter-spacing:4px">'+CODE+'</b></p>':'<p>Il te restait '+(dots+goods)+' éléments à manger. Retente ta chance !</p>')+'<p style="font-size:12px;color:#a6adc8">📞 Drogues Info Service : <b>0 800 23 13 13</b> (gratuit, anonyme) · Urgence : <b>15</b> ou <b>112</b></p><button class="pp-b" id="pp-rp">↻ Rejouer</button>';
  $("pp-rp").onclick=menu}
function menu(){st="menu";var o=$("pp-ov");o.style.display="flex";
  o.innerHTML='<h2>🟡 PAC-PRÉVENTION</h2><p>Mange <b>toutes les pastilles</b> et les <b>bons réflexes</b> (💧🏃😴🤝📞🎸 : +100 et bouclier).</p><p>Évite les <b>produits dangereux</b> (🚬🍺💨💊🌿 : −50) et la <b>pression du groupe</b> 👻 (−100 et une vie). Avec le bouclier, tu peux la repousser : +200 !</p><p style="color:#a6adc8">Flèches / ZQSD, ou glisse le doigt.</p><button class="pp-b" id="pp-n">▶ Normal</button><button class="pp-b r" id="pp-h">🔥 Difficile</button>';
  $("pp-n").onclick=function(){init(false)};$("pp-h").onclick=function(){init(true)}}

function ghost(x,y,col,dx,dy){var r=T*.42;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-1,r,Math.PI,0);ctx.lineTo(x+r,y+r);
  for(var i=0;i<3;i++){ctx.lineTo(x+r-(2*i+1)*r/3,y+r-4);ctx.lineTo(x+r-(2*i+2)*r/3,y+r)}ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x-4,y-3,3.2,0,7);ctx.arc(x+4,y-3,3.2,0,7);ctx.fill();
  ctx.fillStyle="#11111b";ctx.beginPath();ctx.arc(x-4+dx*1.5,y-3+dy*1.5,1.6,0,7);ctx.arc(x+4+dx*1.5,y-3+dy*1.5,1.6,0,7);ctx.fill()}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(bg,0,0);if(!dotAt)return;
  var tt=performance.now()/1000;ctx.fillStyle="#f9e2af";
  for(var r=0;r<H;r++)for(var c=0;c<W;c++)if(dotAt[r][c]){ctx.beginPath();ctx.arc(c*T+T/2,r*T+T/2,2.2,0,7);ctx.fill()}
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="16px serif";
  for(var k in items){var it=items[k],p=k.split(","),x=p[0]*T+T/2,y=p[1]*T+T/2,col=it.g?"#a6e3a1":"#f38ba8";
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.shadowColor=col;ctx.shadowBlur=8+4*Math.sin(tt*4);ctx.beginPath();ctx.arc(x,y,10.5,0,7);ctx.stroke();ctx.restore();
    ctx.fillText(it.e,x,y+1)}
  if(P){var q=pos(P),mv=(P.dx||P.dy)?1:0,m=.05+.25*(mv?Math.abs(Math.sin(tt*14)):1);
    if(scared>0){ctx.strokeStyle="#89dceb";ctx.lineWidth=2;ctx.globalAlpha=.5+.4*Math.sin(tt*8);ctx.beginPath();ctx.arc(q[0],q[1],T*.58,0,7);ctx.stroke();ctx.globalAlpha=1}
    ctx.fillStyle="#f9e2af";ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.arc(q[0],q[1],T*.44,P.a+m*Math.PI,P.a+(2-m)*Math.PI);ctx.closePath();ctx.fill()}
  G.forEach(function(g){var q=pos(g),col=scared>0?((scared>2||Math.floor(tt*6)%2)?"#89b4fa":"#cdd6f4"):g.col;ghost(q[0],q[1],col,g.dx,g.dy)});
  ctx.font="bold 12px sans-serif";pops.forEach(function(p){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillText(p.t,p.x,p.y);ctx.globalAlpha=1});
  if(freeze>0&&st=="play"){ctx.font="bold 22px sans-serif";ctx.fillStyle="#f9e2af";ctx.fillText("PRÊT ?",W*T/2,8*T+4)}}
function loop(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(st=="play")update(dt);draw();requestAnimationFrame(loop)}

var KM={ArrowUp:[0,-1],z:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],q:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener("keydown",function(e){var m=KM[e.key]||KM[(e.key||"").toLowerCase()];if(!m)return;e.preventDefault();want={x:m[0],y:m[1]}});
[["u",0,-1],["d",0,1],["l",-1,0],["r",1,0]].forEach(function(a){$("pp-"+a[0]).onpointerdown=function(e){e.preventDefault();want={x:a[1],y:a[2]}}});
var tx,ty;cv.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  want=Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1}},{passive:true});
$("pp-mu").onclick=function(){mu=!mu;this.textContent=mu?"🔇":"🔊"};
$("game").addEventListener("click",function(){this.focus()});
buildBg();menu();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
